name: Notify New Client Added

on:
  push:
    paths:
      - 'clients.md'
    branches:
      - main
      - master

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit info
        id: info
        run: |
          echo "author=$(git log -1 --format='%an')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --format='%s')" >> $GITHUB_OUTPUT
          echo "commit_url=https://github.com/${{ github.repository }}/commit/${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Client List Updated - Praveen Dev"
          to: ${{ secrets.EMAIL_ADDRESS }}, ${{ secrets.COLLABORATOR_EMAIL }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          body: |
            The client list was updated!

            Commit: ${{ steps.info.outputs.message }}
            Author: ${{ steps.info.outputs.author }}
            View changes: ${{ steps.info.outputs.commit_url }}
            View full list: https://github.com/${{ github.repository }}/blob/main/clients.md

            - Praveen Dev Agency
