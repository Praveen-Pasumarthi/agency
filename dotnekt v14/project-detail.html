<!DOCTYPE html>

<body>

<div class="noise-overlay"></div>

<!-- Orbit Background -->
<div class="project-hero-orbit">

    <div class="project-orbit-outer">
        <div class="project-outer-track">
            <div class="project-dot-position project-dot-1"><div class="project-orbit-dot"></div></div>
            <div class="project-dot-position project-dot-2"><div class="project-orbit-dot"></div></div>
            <div class="project-dot-position project-dot-3"><div class="project-orbit-dot"></div></div>
        </div>
    </div>
    <div class="project-orbit-inner">
        <div class="project-inner-track">
            <div class="project-dot-position project-dot-1"><div class="project-orbit-dot"></div></div>
            <div class="project-dot-position project-dot-2"><div class="project-orbit-dot"></div></div>
            <div class="project-dot-position project-dot-3"><div class="project-orbit-dot"></div></div>
        </div>
    </div>
</div>

<nav class="detail-nav">
    <div class="logo">
        <span class="logo-dot">DOT</span><span class="logo-nekt">NEKT</span>
    </div>
    <a href="index.html#work" class="back-link">
        <span>&mdash;</span>
        <span>BACK TO WORK</span>
    </a>
</nav>

<main class="project-page">
    <div class="project-details">
        <div class="project-label" id="projectLabel">01 / BRANDING</div>
        <h1 class="project-title" id="projectTitle">NKS GAMING<br>GOS</h1>
        <div class="project-category" id="projectCategory">BRAND IDENTITY / VISUAL DESIGN</div>

            <div class="info-label">ABOUT</div>

            <div class="services-info">

                <p class="info-text" id="projectServices">Branding<br>Visual Identity<br>Graphic Design</p>
            </div>
        </div>
    </div>
    <div class="project-main-image">
        <img src="images/project01.jpeg" alt="Project Hero" id="projectImage">
    </div>
</main>

<div class="project-footer">
    <a href="index.html#work" class="back">&mdash; BACK TO WORK</a>
