<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Details — DOTNEKT</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/service-detail.css">
</head>

<body>

    <!-- Orbit Background -->
    <div class="service-hero-orbit">
        <div class="service-orbit-outer">
            <div class="service-outer-track">
                <div class="service-dot-position service-dot-1">
                    <div class="service-orbit-dot"></div>
                </div>
                <div class="service-dot-position service-dot-2">
                    <div class="service-orbit-dot"></div>
                </div>
                <div class="service-dot-position service-dot-3">
                    <div class="service-orbit-dot"></div>
                </div>
            </div>
        </div>
        <div class="service-orbit-inner">
            <div class="service-inner-track">
                <div class="service-dot-position service-dot-1">
                    <div class="service-orbit-dot"></div>
                </div>
                <div class="service-dot-position service-dot-2">
                    <div class="service-orbit-dot"></div>
                </div>
                <div class="service-dot-position service-dot-3">
                    <div class="service-orbit-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <nav class="detail-nav">
        <div class="logo">
            <img src="images/logos/logo-orange.png" alt="DOTNEKT" class="logo-img">
        </div>
        <a href="index.html#services" class="back-link">
            <span class="back-text-full">← BACK TO SERVICES</span>
            <span class="back-text-short">← BACK</span>
        </a>
    </nav>

    <main class="service-page">
        <div class="service-details">
            <div class="service-label" id="serviceLabel">01 / BRANDING</div>
            <h1 class="service-title" id="serviceTitle">BRANDING</h1>
            <div class="service-tagline" id="serviceTagline">Identities that stand out and stick.</div>
            <div class="service-information">
                <div class="info-label">WHAT WE DO</div>
                <p class="info-text" id="serviceAbout">We craft bold, memorable brand identities that resonate with your
                    audience and set you apart from the competition.</p>
                <div class="deliverables-info">
                    <div class="info-label">DELIVERABLES</div>
                    <p class="info-text" id="serviceDeliverables">Logo Design<br>Brand Guidelines<br></p>
                </div>
            </div>
        </div>
        <div class="service-main-image">
            <div class="service-image-container">
                <div class="service-image-bg"></div>
                <img src="images/services/content-writer.png" alt="Service" class="service-image" id="serviceImage">
            </div>
        </div>
    </main>

    <div class="service-footer">
        <a href="index.html#services" class="back">← BACK TO SERVICES</a>
        <a href="#" class="next-service" id="nextServiceLink">NEXT SERVICE →</a>
    </div>

    <script src="js/main.js"></script>

</body>

</html>
